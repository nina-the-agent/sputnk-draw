server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # fichiers statiques avec cache court (l'app peut évoluer)
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }

    # types MIME corrects pour les modules ES
    location ~* \.(?:js|mjs)$ {
        add_header Cache-Control "no-cache";
        types { application/javascript js mjs; }
    }

    location ~* \.(?:css|png|jpg|jpeg|gif|svg|ico)$ {
        add_header Cache-Control "no-cache";
    }
    # images qui ne changent pas (polices, etc.) peuvent être cachées longtemps
    location ~* \.woff2?$ {
        add_header Cache-Control "public, max-age=86400";
        expires 1d;
    }

    gzip on;
    gzip_types application/javascript text/css application/json;
}